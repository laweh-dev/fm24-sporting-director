# ─────────────────────────────────────────────────────────────
# FM SAVE COPILOT — STARTER ROLE LIBRARY
# ─────────────────────────────────────────────────────────────
# Attribute weightings for the major FM24 roles.
# Tiers: key (5x), important (3x), useful (1x)
#
# These are sensible defaults based on community consensus and the
# demands of each role. They are OPINIONS — tune them, argue about
# them, PR better ones. That's the point.
#
# Attribute keys use FM's standard names, lowercased with underscores.
# ─────────────────────────────────────────────────────────────

# ===================== GOALKEEPERS =====================

goalkeeper:
  name: "Goalkeeper"
  short: "GK"
  positions: ["GK"]
  duties: ["defend"]
  attributes:
    key: [reflexes, one_on_ones, handling, positioning, concentration]
    important: [agility, command_of_area, aerial_reach, communication, anticipation, decisions]
    useful: [kicking, throwing, first_touch, bravery, composure]

sweeper_keeper:
  name: "Sweeper Keeper"
  short: "SK"
  positions: ["GK"]
  duties: ["defend", "support", "attack"]
  attributes:
    key: [reflexes, one_on_ones, rushing_out, positioning, agility]
    important: [command_of_area, kicking, first_touch, passing, anticipation, composure, concentration]
    useful: [handling, throwing, vision, decisions, acceleration, pace]
  duty_modifiers:
    attack:
      promote: [passing, first_touch, vision]
    defend:
      promote: [handling, command_of_area]

